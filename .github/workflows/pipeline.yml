name: Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: thumbv6m-none-eabi

jobs:
  metadata:
    name: Detect release tag
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.tag.outputs.is_release }}
      is_public: ${{ steps.tag.outputs.is_public }}
    steps:
      - id: tag
        name: Match vX.Y.Z[-alpha|beta|rc.N]
        shell: bash
        run: |
          # v1.0.0 et plus sans suffixe => release publiee + Dependency-Track.
          # v0.x.y et pre-releases alpha/beta/rc => draft, pas de Dependency-Track.
          is_release=false
          is_public=false
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            is_release=true
            if ((10#${BASH_REMATCH[1]} > 0)) && [[ -z "${BASH_REMATCH[2]}" ]]; then
              is_public=true
            fi
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "is_public=$is_public" >> "$GITHUB_OUTPUT"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    outputs:
      has_vex: ${{ steps.vex.outputs.has_vex }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate CycloneDX 1.6 SBOM
        run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cdxgen@latest \
            -o sbom/bom.cdx.json \
            --spec-version 1.6
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom/bom.cdx.json
          retention-days: 7
      - name: Link optional VEX to SBOM
        id: vex
        shell: bash
        run: |
          shopt -s nullglob
          vex_files=(vex/*.cdx.json)
          case ${#vex_files[@]} in
            0) echo "has_vex=false" >> "$GITHUB_OUTPUT"; echo "No VEX file in vex/"; exit 0 ;;
            1) ;;
            *) echo "Expected one VEX file, found ${#vex_files[@]}" >&2; exit 1 ;;
          esac
          bash scripts/link-vex-to-sbom.sh \
            sbom/bom.cdx.json "${vex_files[0]}" sbom/vex.cdx.json
          echo "has_vex=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: steps.vex.outputs.has_vex == 'true'
        with:
          name: vex
          path: sbom/vex.cdx.json
          retention-days: 7

  trivy:
    name: Scan SBOM with Trivy
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - uses: actions/download-artifact@v8
        if: needs.sbom.outputs.has_vex == 'true'
        with:
          name: vex
          path: sbom
      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Fail on HIGH or CRITICAL vulnerabilities
        shell: bash
        run: |
          vex_args=()
          [[ -f sbom/vex.cdx.json ]] && \
            vex_args=(--vex sbom/vex.cdx.json --show-suppressed)

          trivy sbom sbom/bom.cdx.json \
            "${vex_args[@]}" \
            --severity HIGH,CRITICAL \
            --exit-code 1

  check:
    name: Format + Lint
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: printf '%s' "${GITHUB_REF_NAME#v}" > VERSION
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: make lint

  test:
    name: Unit Tests
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: printf '%s' "${GITHUB_REF_NAME#v}" > VERSION
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: make test-unit

  build:
    name: Build All
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: printf '%s' "${GITHUB_REF_NAME#v}" > VERSION
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, x86_64-pc-windows-gnu
          components: llvm-tools-preview
      - name: Install tools
        run: |
          cargo install cargo-binutils flip-link
          sudo apt-get update
          sudo apt-get install -y libudev-dev gcc-arm-none-eabi cmake mingw-w64
      - name: Build all
        run: make all
      - uses: actions/upload-artifact@v5
        with:
          name: build
          path: |
            target/${{ env.TARGET }}/release/crispy-bootloader
            target/${{ env.TARGET }}/release/crispy-bootloader.bin
            target/${{ env.TARGET }}/release/crispy-bootloader.uf2
            target/${{ env.TARGET }}/release/crispy-fw-sample-rs
            target/${{ env.TARGET }}/release/crispy-fw-sample-rs.bin
            crispy-fw-sample-cpp/build/crispy-fw-sample-cpp.elf
            crispy-fw-sample-cpp/build/crispy-fw-sample-cpp.bin
            target/release/crispy-upload
            target/x86_64-pc-windows-gnu/release/crispy-upload.exe

  release:
    name: Create GitHub Release
    needs: [metadata, trivy, check, test, build]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: ./scripts/ci/prepare-release-assets.sh release release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: ${{ needs.metadata.outputs.is_public != 'true' }}

  dtrack:
    name: Publish SBOM to Dependency-Track
    needs: [metadata, sbom, trivy, check, test, build]
    if: needs.metadata.outputs.is_public == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - uses: actions/download-artifact@v8
        if: needs.sbom.outputs.has_vex == 'true'
        with:
          name: vex
          path: sbom
      - name: Publish SBOM and optional VEX
        shell: bash
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ github.ref_name }}
        run: |
          : "${DTRACK_URL:?DTRACK_URL variable is not set}"

          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST ${DTRACK_URL%/}/api/v1/bom \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=$PROJECT_NAME" \
            -F "projectVersion=$PROJECT_VERSION" \
            -F "bom=@sbom/bom.cdx.json")
          case "$code" in
            2*) echo "SBOM published to $PROJECT_NAME@$PROJECT_VERSION" ;;
            *) cat response.json; exit 1 ;;
          esac

          if [[ ! -f sbom/vex.cdx.json ]]; then
            echo "No VEX to publish"
            exit 0
          fi

          # Attend la fin du traitement d'un token Dependency-Track.
          wait_token() {
            local processing
            for attempt in {1..20}; do
              processing=$(curl -sSf \
                -H "X-Api-Key: $DTRACK_API_KEY" \
                "${DTRACK_URL%/}/api/v1/event/token/$1" \
                | jq -r '.processing')
              [[ "$processing" == false ]] && return 0
              sleep 2
            done
            echo "Dependency-Track did not finish processing $2" >&2
            return 1
          }

          wait_token "$(jq -er '.token' response.json)" SBOM

          code=$(curl -sS -o vex-response.json -w '%{http_code}' \
            -X POST ${DTRACK_URL%/}/api/v1/vex \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "projectName=$PROJECT_NAME" \
            -F "projectVersion=$PROJECT_VERSION" \
            -F "vex=@sbom/vex.cdx.json")
          case "$code" in
            2*) echo "VEX accepted for $PROJECT_NAME@$PROJECT_VERSION" ;;
            *)
              echo "VEX upload failed with HTTP $code" >&2
              [[ ! -s vex-response.json ]] || cat vex-response.json >&2
              exit 1
              ;;
          esac

          wait_token "$(jq -er '.token' vex-response.json)" VEX
